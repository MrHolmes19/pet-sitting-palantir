services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pet_sitting_palantir
      POSTGRES_USER: palantir
      POSTGRES_PASSWORD: palantir
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palantir -d pet_sitting_palantir"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
