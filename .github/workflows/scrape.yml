name: Scrape KiwiHouseSitters

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pet-sitting-palantir-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Write database settings
        env:
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL_SECRET" > .env

      - name: Initialize database
        run: uv run --frozen python -m pet_sitting_palantir --init-db

      - name: Run due scrape scopes
        run: uv run --frozen python -m pet_sitting_palantir --run-due --max-pages all --pretty
