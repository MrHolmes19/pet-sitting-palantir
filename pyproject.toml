[project]
name = "pet-sitting-palantir"
version = "0.1.0"
description = "Personal KiwiHouseSitters scraper and alerting system for New Zealand pet sitting opportunities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "python-dotenv>=1.2.1",
  "requests>=2.32.5",
]

[project.scripts]
pet-sitting-palantir = "pet_sitting_palantir.main:main"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.14.10",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
